bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False  # Changed for real robot

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False  # Changed for real robot

controller_server:
  ros__parameters:
    use_sim_time: False  # Changed for real robot
    controller_frequency: 10.0  # Reduced from 20.0 for RPi - KEY CHANGE
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 0.3 -> 1.0. This is how long FollowPath may keep failing before the server
    # aborts the goal. map->odom freezes of 0.6 s were exceeding it and killing
    # otherwise-healthy navigation; 1.0 rides through them.
    failure_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      # REVERTED to SimpleProgressChecker on 2026-08-27. It was swapped for
      # PoseProgressChecker (d736f9c) on the theory that the robot was being
      # punished for purposefully turning to face its path near a wall. Field
      # testing disproved that: the robot was OSCILLATING, not turning, and the
      # abort was the only thing rescuing it.
      #
      # Why Pose made it worse: it counts rotation as progress, so a robot
      # rocking in place keeps PASSING the check. It never aborts, so recovery
      # never runs, so nothing physically shoves the robot out of the stuck
      # spot. Meanwhile the Oscillation critic keeps banning directions until
      # nothing is left. A narrow passage that used to traverse fine became an
      # almost-certain lockup.
      #
      # Simple's abort IS the escape hatch. Keep it. The dithering itself is
      # addressed by oscillation_reset_time in FollowPath below.
      plugin: "nav2_controller::SimpleProgressChecker"
      # Relaxed 2026-08-25 from 0.5 m / 10.0 s. That pair demanded 0.05 m/s
      # sustained, which was 10% of the old max_vel_x (0.50) but 23% of the
      # current 0.22 — calibrated for a robot twice as fast.
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Relaxed 2026-08-25 from 0.10 alongside yaw_goal_tolerance below, for the
      # same reason: the base now accelerates at 0.5 m/s^2 instead of 2.5, so it
      # coasts into the goal more slowly and a tight window is easy to overshoot
      # and then hunt around. 15cm matches what nav2_params_sim.yaml already uses.
      xy_goal_tolerance: 0.15
      # Relaxed 2026-08-25 from 0.09 (5.2 deg). The robot was physically arriving
      # at the goal but the checker never fired, so it replanned forever. 0.09 was
      # chosen when acc_lim_theta was 3.2; it is now 2.0 to match what the base can
      # actually do, which means the robot settles into the goal heading more slowly
      # and needs more margin. 0.20 rad = 11.5 deg. nav2_params_sim.yaml independently
      # arrived at 0.15 for the same reason.
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Velocity/accel model MUST stay under what the hardware can deliver, or
      # DWB scores trajectories the robot cannot follow: the ESP interface
      # silently clamps every command, predicted and actual paths diverge each
      # cycle, and the result is jerky rotation plus "Failed to make progress".
      # Ceiling is max_velocity (4.5 rad/s) * wheel_radius (0.06 m) = 0.27 m/s
      # and motor_accel = 0.5 m/s^2, both from ros2_control.xacro. 0.22 leaves
      # ~18% margin so the controller never plans into the clamp.
      max_vel_x: 0.22
      max_vel_y: 0.0
      # Pure spin at 1.0 rad/s needs only 1.0 * 0.2895/2 = 0.145 m/s per wheel,
      # comfortably inside the 0.27 limit — this one was never the problem.
      max_vel_theta: 1.0
      # Measured deadband, bench test 2026-08-25 on the real floor: the base does
      # not move below 0.03 m/s or rotate below 0.10 rad/s — commands under those
      # are accepted, produce no motion, and are invisible in the logs. With both
      # of these at 0.0, DWB sampled 15 velocities across 0..0.22 (steps of
      # ~0.0157), so its two lowest non-zero linear samples were BELOW the
      # threshold. Picking one meant the robot sat still while controller_server
      # happily logged "Passing new path to controller", until the progress
      # checker gave up at exactly 10 s with "Failed to make progress".
      #
      # DWB rejects a trajectory only when translation < min_speed_xy AND
      # |rotation| < min_speed_theta, so setting BOTH is required: it discards
      # crawl-in-both-axes while still allowing a clean rotate-in-place or a
      # clean straight run.
      #
      # Set to the measured values EXACTLY, with no safety margin (2026-08-27).
      # They previously carried +33% / +20%. Note the thresholds were measured
      # at one battery level on one floor surface and both rise as the pack
      # drains, so with no margin these can fall below the real floor late in a
      # charge — if stalls reappear specifically on low battery or a different
      # surface, re-run the sweep rather than assuming these still hold.
      # min_vel_x stays 0.0 — that bounds the sample RANGE, and a positive value
      # would stop DWB ever sampling zero, i.e. never being able to stop.
      min_speed_xy: 0.03
      max_speed_xy: 0.22
      min_speed_theta: 0.10

      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 15  # Reduced from 20 for RPi
      vy_samples: 5
      vtheta_samples: 15  # Reduced from 20 for RPi
      # NOT use_sim_time — unrelated. This is DWB's forward simulation horizon:
      # how far ahead each of the ~236 candidate trajectories is rolled before
      # being collision-checked and scored.
      #
      # 1.7 s at max_vel_x 0.22 traced a 0.37 m arc. A 0.8 m corridor leaves
      # only a ~0.36 m strip for the robot centre (walls are lethal out to
      # robot_radius 0.22), so any arc with curvature left that strip and was
      # rejected — hence "No valid trajectories out of 236!" and a fall to
      # recovery in exactly the places the robot could physically fit.
      #
      # 1.2 s traces 0.26 m, which fits. Going below ~0.8 would start losing
      # corner anticipation. Side benefit: DWB samples each arc every
      # linear_granularity (0.05 m) and does a costmap lookup per point, so a
      # shorter horizon is proportionally less work in controller_server.
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      # 0.2 -> 0.5. Measured map->odom staleness reached 0.62 s on hardware while
      # this budget was 0.2, so DWB rejected the robot's own pose mid-path.
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.15   # Must match general_goal_checker xy_goal_tolerance
      yaw_goal_tolerance: 0.20   # Must match general_goal_checker yaw_goal_tolerance
      trans_stopped_velocity: 0.25
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # The Oscillation critic bans a direction once it sees the robot reverse
      # into it, to stop dithering. The ban lifts on oscillation_reset_dist
      # (0.05 m) or oscillation_reset_angle (0.2 rad) — and, if set, after
      # oscillation_reset_time seconds. That last one defaults to -1, meaning
      # NEVER, which creates a closed loop: the robot is banned from the only
      # directions it could use, so it cannot travel the 5 cm that would lift
      # the ban, so it stays banned. Observed 2026-08-27 as a hard lockup —
      # "No valid trajectories out of 236!" with 44% rejected by Oscillation
      # and 56% by BaseObstacle, indefinitely, while even the spin recovery
      # failed with "Collision Ahead".
      #
      # 5.0 s gives the critic a timeout so it can still stop genuine dithering
      # without being able to trap the robot permanently.
      Oscillation.oscillation_reset_time: 5.0
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      # 0.1 -> 0.325 (nav2's default) on 2026-08-27. The alignment critics work
      # by projecting a point this far ahead of the robot and scoring how close
      # it lands to the path — it is how DWB judges "am I pointing the right
      # way?". At 0.1 m that point sat INSIDE the robot's own footprint
      # (robot_radius 0.22), so rotating the robot barely moved it and the
      # alignment signal was tiny and noisy. DWB could not distinguish a good
      # heading from a bad one, so it over-corrected, swung past, and corrected
      # back — the rocking-in-place seen on hardware.
      #
      # It was goal-dependent for the same reason: with the path roughly
      # straight ahead the weak signal sufficed, but a path demanding a real
      # turn needed exactly the gradient that was missing. Confirmed on
      # hardware — while stuck oscillating, a different nearby goal was reached
      # without trouble, which rules out the robot, the wheels, twist_mux and
      # /cmd_vel and leaves trajectory scoring as the only candidate.
      #
      # 0.325 -> 0.2, correcting an overshoot. 0.325 is nav2's default, sized for
      # faster robots with longer simulation windows. Here sim_time 1.2 at
      # max_vel_x 0.22 traces only a 0.26 m arc, so a 0.325 m forward point sat
      # BEYOND the end of every candidate trajectory — the robot was aligning to
      # a point none of them ever reach, anticipating turns too early and weaving.
      # Reported from hardware as a loss of smoothness on paths that previously
      # ran cleanly.
      #
      # The window is bounded on both sides:
      #   below ~0.114  the point is inside the footprint, heading changes barely
      #                 move it, signal is noise -> rocking in place (the 0.1 bug)
      #   above ~0.26   the point is past the simulated arc -> over-anticipation
      # 0.2 sits between: clear of the body, inside the arc.
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0  # Reduced from 5.0 for RPi
      publish_frequency: 1.0  # Reduced from 2.0 for RPi
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False  # Changed for real robot
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # LOCAL costmap only — global still uses robot_radius.
      #
      # robot_radius describes a CIRCLE, so 0.22 told nav2 the robot is 0.44 m
      # across in every direction. It is not: 0.228 m long (chassis_length) by
      # 0.345 m wide (wheel span, wheel_offset_y 0.14475 + wheel_thickness/2).
      # 0.22 is the CIRCUMSCRIBED radius applied even lengthwise, where the true
      # half-extent is 0.114.
      #
      # The cost of that: every cell within 0.22 m of an obstacle is marked
      # INSCRIBED_INFLATED_OBSTACLE (253), and DWB's BaseObstacle critic throws
      # out any trajectory touching one. Every trajectory starts at the robot's
      # current pose, so once the centre drifts inside that band ALL 236 are
      # rejected before they begin — observed on hardware 2026-08-27 as
      # "No valid trajectories out of 236! 1.00: BaseObstacle/Trajectory Hits
      # Obstacle", reliably near walls and never in open space.
      #
      # The real polygon drops the inscribed radius to 0.114, roughly halving
      # how close the robot may legitimately approach a wall.
      #
      # TRADE-OFF: BaseObstacle samples trajectory CENTRE points and relies on
      # the inscribed radius for margin. With a smaller one there is less slack,
      # so corner-clipping while turning becomes possible. The proper mitigation
      # is the ObstacleFootprint critic (full-polygon checking), deliberately not
      # added here because it costs CPU this RPi4 does not currently have.
      footprint: "[[0.114, 0.1723], [0.114, -0.1723], [-0.114, -0.1723], [-0.114, 0.1723]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # RESTORED to 0.55 on 2026-08-27. It was cut to 0.30 on the theory that a
        # wide halo was what blocked narrow passages — that diagnosis was WRONG.
        # The narrow-path failures turned out to be RViz publishing goals in the
        # `odom` frame (main.rviz Fixed Frame), which aged out of the 10 s tf2
        # buffer. Fixing the frame fixed the passages; the inflation cut fixed
        # nothing and cost real obstacle avoidance.
        #
        # Why it hurt: the band between robot_radius (0.22) and inflation_radius
        # is the GRADIENT that pushes the robot off walls — not a hard limit, a
        # preference. At 0.30 that band was only 8 cm wide and, with
        # cost_scaling_factor 3.0, decayed to nothing almost immediately. The
        # local costmap is what DWB scores against, so the controller was left
        # effectively blind to obstacle proximity: clipped corners, wall-brushing
        # and extra recoveries.
        #
        # Compounding it, BaseObstacle.scale is 0.02 against PathAlign/PathDist
        # at 32.0 — obstacle cost is already weighted ~1500x lower than path
        # following. Narrowing the inflation removed what little signal was left.
        # If active obstacle avoidance is wanted, BaseObstacle.scale is the real
        # lever; change it deliberately and on its own.
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5  # Reduced from 1.0 for RPi - KEY CHANGE
      publish_frequency: 0.5  # Reduced from 1.0 for RPi
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False  # Changed for real robot
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # GLOBAL costmap only — this pair biases PLANNED PATHS toward the middle
        # of open space. The local costmap is deliberately left alone, because
        # that is what governs whether the controller can commit to a narrow gap.
        #
        # Neither value can make a passage impassable. Only cells within
        # robot_radius (0.22) are lethal; everything out to inflation_radius is
        # merely expensive, so a narrow corridor stays traversable — it is still
        # the cheapest route when it is the only route.
        #
        # cost = 252 * exp(-cost_scaling_factor * distance_past_robot_radius)
        #
        # cost_scaling_factor is a DECAY RATE, so LOWER pushes the robot FURTHER
        # from walls. At 3.0 the cost collapsed almost immediately (56 at 50 cm
        # past the radius), making "40 cm from a wall" and "80 cm from a wall"
        # look equally acceptable to the planner. At 2.0 the gradient survives
        # far enough out to actually express a preference for open space.
        #
        # inflation_radius sets how FAR the gradient reaches; cost_scaling_factor
        # sets how STEEP it is. A wide radius with a steep factor is still flat
        # where it matters, so both move together or neither does.
        cost_scaling_factor: 2.0
        inflation_radius: 0.70
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False  # Changed for real robot
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False  # Changed for real robot
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # Reduced from 20.0 for RPi - KEY CHANGE
    use_sim_time: False  # Changed for real robot
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true #false ----------------------------------- //new update Dijkstra to A algorithm faster now but only downside of A* is in not good in very complex maze-like environments with many dead-ends
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False  # Changed for real robot
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    # 0.1 -> 0.3. behavior_server had the tightest budget of any node, so the
    # recovery behaviours failed for the same reason the controller did — which
    # is why the robot spun and stopped instead of recovering.
    transform_tolerance: 0.3
    use_sim_time: False  # Changed for real robot
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    # Lowered from 3.2 to match the controller. Recovery spins were the most
    # violent motion on the robot because this path bypasses FollowPath's limits.
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False  # Changed for real robot

waypoint_follower:
  ros__parameters:
    use_sim_time: False  # Changed for real robot
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False  # Changed for real robot
    smoothing_frequency: 10.0  # Reduced from 20.0 for RPi
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Must match FollowPath's limits above — a smoother that permits more than
    # the planner does just re-introduces the clamp it exists to avoid.
    max_velocity: [0.22, 0.0, 1.0]
    min_velocity: [-0.22, 0.0, -1.0]
    max_accel: [0.5, 0.0, 2.0]
    max_decel: [-0.5, 0.0, -2.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0